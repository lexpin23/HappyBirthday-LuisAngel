<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia Leslie — Aventura Cósmica</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <div id="orientationOverlay">
    <div class="rotate-icon">📱</div>
    <div style="font-size:1.4rem; margin-bottom:0.5rem;">Gira tu pantalla</div>
    <div style="font-size:0.9rem; color:#c8a0ff;">Esta aventura cósmica se disfruta mejor en modo horizontal.</div>
  </div>

  <audio id="bgm" loop></audio>

  <canvas id="stars"></canvas>
  <canvas id="fxCanvas"></canvas>
  <div id="lumaGame"></div>

  <div class="planet planet-blue"></div>
  <div class="planet planet-purple"></div>
  <div class="planet planet-orange"></div>

  <div class="star-collect" id="starBar">
    <span>★</span>
    <span id="starCount">0</span> estrellas
  </div>

  <div id="startOverlay">
    <div class="luma-star luma-1"></div>
    <div class="luma-star luma-2"></div>
    <div class="luma-star luma-3"></div>
    <div class="luma-star luma-4"></div>
    <div class="luma-star luma-5"></div>
    <div class="start-content">
      <div id="loadingMessage" class="loading-message">Cargando aventura...</div>
      <button id="btnStart" style="display: none;"><span>✦ Comenzar aventura ✦</span></button>
    </div>
  </div>

  <div class="scene">
    <div class="logo" id="logo">★ GALAXIA LESLIE ★</div>
    <div class="subtitle-top" id="subtitleTop">Una aventura cósmica — solo para ti</div>

    <div class="text-box" id="textBox">
      <div class="phase-tag" id="phaseTag"></div>
      <div class="narration" id="narration"></div>
      <div id="quizContent" style="display:none;">
        <div class="quiz-counter" id="quizCounter"></div>
        <div class="quiz-question" id="quizQuestion"></div>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-feedback" id="quizFeedback"></div>
      </div>
      <button class="btn-continue" id="btnContinue"><span></span></button>
    </div>
  </div>

  <script src="game.js?v=12"></script>
</body>
</html>
